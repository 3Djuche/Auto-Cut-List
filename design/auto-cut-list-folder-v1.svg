<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Auto Cut List: a manila folder holding a square steel tube and a bent sheet-metal bracket,
       with a label tag on the front. Original artwork. -->
  <defs>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a65a"/><stop offset="1" stop-color="#b9843a"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d08c"/><stop offset="1" stop-color="#e2b062"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d6e3"/><stop offset="1" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8aa6"/><stop offset="1" stop-color="#4c6683"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eaf1"/><stop offset="1" stop-color="#b4c4d4"/>
    </linearGradient>
    <linearGradient id="hollow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2c3a"/><stop offset="1" stop-color="#3a5068"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe5ea"/><stop offset="1" stop-color="#aeb9c3"/>
    </linearGradient>
    <linearGradient id="flange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9aa8b5"/><stop offset="1" stop-color="#c7d0d8"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e8870e"/>
    </linearGradient>
  </defs>
  <g stroke="#2b3e52" stroke-width="7" stroke-linejoin="round">
    <!-- Folder back, with its tab -->
    <path d="M12 74 V58 a8 8 0 0 1 8 -8 H82 a8 8 0 0 1 7 4 l8 14 H236 a8 8 0 0 1 8 8 V236 H12 Z" fill="url(#folderBack)"/>

    <!-- Sheet-metal bracket: an upright plate whose top is bent back into a flange -->
    <path d="M34 60 L58 40 H124 L100 60 Z" fill="url(#flange)"/>
    <path d="M34 60 H100 V170 H34 Z" fill="url(#plate)"/>
    <circle cx="67" cy="96" r="11" fill="#2b3e52" stroke-width="0"/>

    <!-- Square tube, standing up behind the folder front -->
    <g transform="translate(112 18)">
      <path d="M0 52 L44 22 H120 L76 52 Z" fill="url(#top)"/>
      <path d="M76 52 L120 22 V150 L76 180 Z" fill="url(#side)"/>
      <rect x="0" y="52" width="76" height="128" fill="url(#front)"/>
      <!-- Cut end with its hollow -->
      <path d="M22 47 L49 28 H98 L71 47 Z" fill="url(#hollow)" stroke-width="5"/>
    </g>

    <!-- Folder front -->
    <path d="M4 132 a8 8 0 0 1 8 -8 H244 a8 8 0 0 1 8 8 L240 236 H16 Z" fill="url(#folderFront)"/>
  </g>
  <!-- Bend line along the bracket's top edge -->
  <path d="M38 63 H98" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- Label tag on the folder front -->
  <g transform="rotate(10 196 190)">
    <path d="M168 142 H220 a10 10 0 0 1 10 10 V226 a10 10 0 0 1 -10 10 H168 a10 10 0 0 1 -10 -10 V160 Z"
          fill="url(#tag)" stroke="#2b3e52" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="194" cy="162" r="8" fill="#2b3e52"/>
    <rect x="172" y="182" width="44" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
    <rect x="172" y="200" width="32" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
